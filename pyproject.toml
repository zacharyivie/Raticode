[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gofer-flow"
version = "0.3.4"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "apscheduler>=3.10",
    "networkx>=3.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.2",
    "rich>=13.7",
    "anyio>=4.14.2",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0",
    "tomli-w>=1.0",
    "questionary>=2.0",
    "jsonschema>=4.23",
    "tzdata>=2026.2",
    "watchdog>=6.0.0",
    "vosk>=0.3.45; sys_platform != 'darwin'",
]

[project.optional-dependencies]
xlsx = [
    "openpyxl>=3.1",
]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "mypy>=1.10",
    "ruff>=0.4",
]

[project.scripts]
gof = "gofer.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gofer"]

[tool.hatch.build.targets.wheel.force-include]
"rattish/contracts" = "gofer/rattish/assets/contracts"
"rattish/providers" = "gofer/rattish/assets/providers"
"rattish/schemas" = "gofer/rattish/assets/schemas"
"rattish/spec" = "gofer/rattish/assets/docs"
"skills/gofer-flow-workflow-builder" = "gofer/rattish/assets/assistant-skill"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*", "tomli_w", "apscheduler", "apscheduler.*", "openpyxl", "openpyxl.*", "vosk", "vosk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
# Keep application code strict while allowing pytest monkeypatches, fixtures, and
# dynamic assertions to remain concise. The tests are still included in
# `mypy src tests` so import/type regressions outside these test-only patterns
# are checked.
disable_error_code = [
    "arg-type",
    "attr-defined",
    "call-overload",
    "no-untyped-def",
    "str-bytes-safe",
    "union-attr",
    "unused-ignore",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pyinstaller>=6.21.0",
    "setuptools>=83.0.0",
    "pip-audit>=2.10.0",
]
