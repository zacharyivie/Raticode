<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizations 2.0 · interactive wireframe (sample data)</title>
<style>
:root {
  --canvas: #eef2f5; --panel: #ffffff; --raised: #f6f8fa; --ink: #1e2a33; --muted: #5a6874; --faint: #8796a1;
  --line: #d7dfe6; --line-strong: #c3ced7; --accent: #215879; --on-accent: #ffffff; --soft: #e4eef3;
  --run: #17767b; --run-soft: #def1f1; --review: #8f5d16; --review-soft: #fbefd9; --blocked: #a13c36; --blocked-soft: #f8e3e1;
  --done: #23765a; --done-soft: #e0f1e8; --todo: #4d5d6a; --todo-soft: #e8edf1;
  --k-decision: #6a4bb0; --k-note: #215879; --k-report: #8f5d16; --k-spec: #17767b; --k-finding: #a13c36; --k-ticket: #4d5d6a;
  --shadow: 0 1px 2px rgba(20, 40, 55, .06), 0 8px 24px rgba(20, 40, 55, .08);
  --sheet-w: 440px;
  color-scheme: light;
}
[data-theme="dark"] {
  --canvas: #0e1820; --panel: #15232e; --raised: #1a2a36; --ink: #e3ecf1; --muted: #a2b3bf; --faint: #7b8e9b;
  --line: #29404e; --line-strong: #355063; --accent: #8ac9e2; --on-accent: #0f2330; --soft: #1f3746;
  --run: #6fd0d3; --run-soft: #173538; --review: #eac182; --review-soft: #39301d; --blocked: #f6aaa2; --blocked-soft: #3d2523;
  --done: #88d3b4; --done-soft: #1a3a2e; --todo: #b4c3cd; --todo-soft: #22323d;
  --k-decision: #c2a8f5; --k-note: #8ac9e2; --k-report: #eac182; --k-spec: #6fd0d3; --k-finding: #f6aaa2; --k-ticket: #b4c3cd;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.5 Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.key, code { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, monospace; font-size: .92em; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* ---------- App frame ---------- */
.app { display: grid; grid-template-columns: 48px 214px minmax(0, 1fr); height: 100vh; }
.rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; }
.rail span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; color: var(--faint); }
.rail span.on { background: var(--soft); color: var(--accent); }
.orgs { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 8px; overflow: auto; }
.orgs h2 { font-size: 12px; font-weight: 650; margin: 2px 8px 10px; display: flex; align-items: center; justify-content: space-between; }
.orgs .tag { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 99px; background: var(--review-soft); color: var(--review); }
.org-item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 9px 8px; border-radius: 8px; }
.org-item[aria-current] { background: var(--soft); }
.org-item b { display: block; font-weight: 600; font-size: 12.5px; }
.org-item small { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 11px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; flex-shrink: 0; }
.org-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; background: var(--accent); flex-shrink: 0; }
[data-theme="dark"] .org-mark { color: var(--on-accent); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; transition: margin-right .18s ease; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 22px; background: var(--panel); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 15px; margin: 0; font-weight: 700; }
.top .grow { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.st-running { color: var(--run); background: var(--run-soft); } .st-review { color: var(--review); background: var(--review-soft); }
.st-blocked { color: var(--blocked); background: var(--blocked-soft); } .st-done { color: var(--done); background: var(--done-soft); }
.st-todo, .st-backlog, .st-idle, .st-planned { color: var(--todo); background: var(--todo-soft); }
.st-paused { color: var(--review); background: var(--review-soft); }
.st-working { color: var(--run); background: var(--run-soft); } .st-needs { color: var(--blocked); background: var(--blocked-soft); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); font-weight: 550; font-size: 12.5px; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { height: 26px; padding: 0 8px; font-size: 12px; }
.search { display: inline-flex; align-items: center; gap: 8px; height: 30px; min-width: 220px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: var(--raised); }
.search kbd { margin-left: auto; font: 11px ui-monospace, monospace; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; }
.sample { font-size: 11px; font-weight: 600; color: var(--review); border: 1px dashed var(--review); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }

.tabs { display: flex; gap: 4px; padding: 0 18px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { display: inline-flex; align-items: center; gap: 7px; padding: 11px 10px 10px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 550; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.count { min-width: 18px; padding: 0 5px; height: 18px; border-radius: 99px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--blocked-soft); color: var(--blocked); }
.view { flex: 1; overflow: auto; padding: 22px 26px 60px; min-height: 0; }
.hint { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; padding: 8px 12px; border-radius: 8px; background: var(--soft); color: var(--ink); font-size: 12.5px; }
.hint b { font-weight: 650; }
.hint .grow { flex: 1; }

/* ---------- Shared bits ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; }
.section-head h2, .section-head h3 { margin: 0; font-size: 14px; font-weight: 700; }
.section-head .grow { flex: 1; }
.bar { height: 6px; border-radius: 99px; background: var(--todo-soft); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .4s ease; }
.bar.run i { background: var(--run); }
:is(span, div, header) > .bar { flex: 1 1 auto; min-width: 56px; }
.ev + .ev, .ev + span { margin-left: 6px; }
.sheet-title h2:focus { outline: none; }
.main { container-type: inline-size; }
.top h1 { white-space: nowrap; }
.search .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search kbd { white-space: nowrap; }
@container (max-width: 1080px) { .search { min-width: 0; } .search .lbl, .top .sample { display: none; } }
@container (max-width: 760px) { #simBtn span { display: none; } } .bar.done i { background: var(--done); }
.chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 2px 8px 2px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; text-align: left; }
.chip:hover { border-color: var(--accent); }
.chip .k { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; }
.ev { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 650; }
.ev.ok { color: var(--done); } .ev.warn { color: var(--review); } .ev.bad { color: var(--blocked); } .ev.none { color: var(--faint); }
.empty { padding: 18px; text-align: center; color: var(--muted); }

/* ---------- Organization tab ---------- */
.mission { padding: 22px 24px; margin-bottom: 18px; display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; align-items: start; }
.mission p.statement { margin: 0; font-size: 22px; line-height: 1.35; font-weight: 650; letter-spacing: -.01em; max-width: 34ch; }
.mission textarea { width: 100%; font-size: 20px; font-weight: 600; line-height: 1.35; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 8px; background: var(--raised); resize: vertical; }
.mission .facts { display: flex; gap: 22px; grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.mission .facts b { color: var(--ink); font-size: 18px; display: block; font-variant-numeric: tabular-nums; }
.timeline { padding: 18px 22px 16px; margin-bottom: 18px; }
.track { position: relative; height: 66px; margin: 6px 10px 4px; }
.track .line { position: absolute; left: 0; right: 0; top: 40px; height: 4px; border-radius: 99px; background: var(--todo-soft); }
.track .today { position: absolute; top: 18px; bottom: 6px; width: 2px; background: var(--run); }
.track .today span { position: absolute; top: -18px; left: -18px; font-size: 11px; font-weight: 650; color: var(--run); white-space: nowrap; }
.track .month { position: absolute; top: 50px; font-size: 11px; color: var(--faint); transform: translateX(-50%); }
.pin { position: absolute; top: 26px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pin i { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--accent); background: var(--accent); margin-top: 6px; }
.pin span { position: absolute; bottom: 26px; font-size: 11.5px; font-weight: 650; white-space: nowrap; }
.ms-rows { display: grid; gap: 2px; margin-top: 8px; }
.ms-row { display: grid; grid-template-columns: minmax(180px, 1.4fr) 92px minmax(120px, 1fr) minmax(160px, 1.6fr); gap: 14px; align-items: center; padding: 9px 8px; border-radius: 8px; text-align: left; width: 100%; }
.ms-row:hover { background: var(--raised); }
.ms-row b { font-weight: 650; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; }
.needs { padding: 16px 18px; }
.need { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.need:first-of-type { border-top: 0; }
.need .what b { display: block; font-weight: 600; }
.need .what small { color: var(--muted); }
.need .acts { display: flex; gap: 6px; }
.icon-badge { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.feed { padding: 16px 18px; }
.feed li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 0; }
.feed ul { list-style: none; margin: 0; padding: 0; }
.feed time { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.proj-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 18px; }
.proj-card { padding: 14px 16px; text-align: left; display: grid; gap: 8px; border-top: 3px solid var(--pc); }
.proj-card:hover { border-color: var(--line-strong); border-top-color: var(--pc); box-shadow: var(--shadow); }
.proj-card b { font-size: 14px; }
.proj-card .meta { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }

/* ---------- Projects tab ---------- */
.projects { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
.plist { display: grid; gap: 6px; position: sticky; top: 0; }
.plist button.p { display: grid; gap: 6px; padding: 11px 12px; border-radius: 9px; text-align: left; border: 1px solid transparent; border-left: 3px solid var(--pc); background: var(--panel); }
.plist button.p[aria-current] { border-color: var(--line); border-left-color: var(--pc); box-shadow: var(--shadow); }
.plist button.p b { font-weight: 650; }
.plist small { color: var(--muted); }
.phead { padding: 18px 20px; margin-bottom: 14px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.phead h2 { margin: 0; font-size: 18px; }
.phead .meta { display: flex; gap: 16px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.milestone { margin-bottom: 14px; overflow: hidden; }
.milestone > header { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
.milestone > header h3 { margin: 0; font-size: 14px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.milestone > header .sub { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 12px; }
.epic-row { display: grid; grid-template-columns: minmax(170px, 1.4fr) minmax(140px, 1fr) 132px auto; gap: 14px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.epic-row:first-of-type { border-top: 0; }
.epic-row:hover { background: var(--raised); }
.epic-row b { font-weight: 600; }
.mini-states { display: flex; gap: 3px; }
.mini-states i { width: 10px; height: 10px; border-radius: 3px; }

/* ---------- Issues tab ---------- */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--panel); }
.seg button { padding: 4px 11px; border-radius: 6px; font-weight: 550; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--accent); }
.toolbar select { height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); padding: 0 8px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 550; }
.board { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 12px; min-width: 1080px; align-items: start; }
.board.epics { grid-template-columns: repeat(3, minmax(260px, 1fr)); min-width: 820px; }
.col { background: var(--raised); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 140px; }
.col > header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; font-weight: 650; }
.col > header .n { color: var(--faint); font-weight: 600; font-variant-numeric: tabular-nums; }
.col-body { padding: 4px 8px 8px; display: grid; gap: 7px; align-content: start; flex: 1; border-radius: 8px; transition: background .12s; }
.col-body.over { background: var(--soft); }
.lane-label { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: 6px 0 -2px; font-weight: 650; }
.lane-label button { display: inline-flex; gap: 8px; align-items: center; }
.lane-label .bar { width: 120px; }
.card { display: grid; gap: 6px; padding: 9px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; text-align: left; width: 100%; cursor: grab; position: relative; }
.card:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.card.dragging { opacity: .45; }
.card .row1 { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--faint); min-width: 0; }
.card .row1 .key { white-space: nowrap; }
.card .row1 > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .row1 .grow { flex: 1; }
.card .title { font-weight: 600; line-height: 1.35; }
.card .row3 { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); }
.card .row3 .grow { flex: 1; }
.card.is-running { border-left: 3px solid var(--run); }
.card.is-review { border-left: 3px solid var(--review); }
.card.flagged { border-left: 3px solid var(--blocked); }
.flag { font-size: 11px; color: var(--blocked); font-weight: 600; display: flex; gap: 5px; align-items: center; }
.livebar { height: 3px; border-radius: 99px; background: var(--run-soft); overflow: hidden; }
.livebar i { display: block; height: 100%; background: var(--run); transition: width .6s ease; }
.add-card { display: flex; align-items: center; gap: 6px; padding: 6px 8px; color: var(--muted); border-radius: 6px; font-weight: 550; }
.add-card:hover { background: var(--panel); color: var(--ink); }
.add-input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--accent); background: var(--panel); }
.epic-card { display: grid; gap: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; text-align: left; border-top: 3px solid var(--pc); }
.epic-card:hover { box-shadow: var(--shadow); }
.epic-card b { font-weight: 650; }
.epic-card .row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.board-wrap { overflow-x: auto; padding-bottom: 6px; }

/* ---------- Workers tab ---------- */
.chart-wrap { overflow: auto; padding: 18px 10px 30px; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; position: relative; }
.tree ul { padding-top: 22px; }
.tree li { position: relative; padding: 22px 6px 0; display: flex; flex-direction: column; align-items: center; }
.tree > li { padding-top: 0; }
.tree li::before, .tree li::after { content: ""; position: absolute; top: 0; width: 50%; height: 22px; border-top: 2px solid var(--line-strong); }
.tree li::before { right: 50%; } .tree li::after { left: 50%; border-left: 2px solid var(--line-strong); }
.tree li:only-child::before, .tree li:only-child::after { display: none; }
.tree li:only-child { padding-top: 0; }
.tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
.tree li:last-child::before { border-right: 2px solid var(--line-strong); border-radius: 0 8px 0 0; }
.tree li:first-child::after { border-radius: 8px 0 0 0; }
.tree ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 22px; border-left: 2px solid var(--line-strong); }
.tree > li::before, .tree > li::after { display: none; }
.chart-wrap > .tree { width: max-content; margin: 0 auto; }
.node { width: 156px; display: grid; gap: 7px; padding: 11px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); text-align: left; }
.node:hover { box-shadow: var(--shadow); border-color: var(--line-strong); }
.node[aria-current] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--soft); }
.node .who { display: flex; gap: 9px; align-items: center; }
.node .who b { display: block; font-weight: 650; line-height: 1.2; }
.node .who small { color: var(--muted); font-size: 11.5px; }
.node .doing { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.node .doing span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node.owner { width: 220px; background: var(--soft); border-color: transparent; }
.node .av { width: 28px; height: 28px; font-size: 11px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12px; align-items: center; }

/* ---------- Knowledge tab ---------- */
.kb { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.graph-wrap { position: relative; padding: 0; overflow: hidden; }
.graph-wrap svg { display: block; width: 100%; height: 560px; touch-action: none; user-select: none; }
@media (max-width: 980px) { .graph-wrap svg { height: 460px; } }
.g-node { cursor: pointer; }
.g-node circle, .g-node rect { stroke: var(--panel); stroke-width: 2.5; transition: opacity .15s; }
.g-node text { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; transition: opacity .15s; }
.g-node.sel circle, .g-node.sel rect { stroke: var(--ink); stroke-width: 3; }
.g-node.match circle, .g-node.match rect { stroke: var(--review); stroke-width: 3.5; }
.g-edge { stroke: var(--line-strong); stroke-width: 1.6; transition: opacity .15s; }
.g-edge.asserted { stroke: var(--accent); stroke-dasharray: 5 4; }
.g-edge.suggested { stroke: var(--faint); stroke-dasharray: 1.5 4; stroke-width: 1.8; }
.g-edge.read { stroke: var(--run); stroke-width: 1.4; }
.g-hull { fill: var(--soft); opacity: .55; }
.g-hull-label { font-size: 11.5px; font-weight: 700; fill: var(--muted); }
svg.dim .g-node:not(.hot) circle, svg.dim .g-node:not(.hot) rect, svg.dim .g-node:not(.hot) text { opacity: .18; }
svg.dim .g-edge:not(.hot) { opacity: .1; }

.decide { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Palette, toasts ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 20, 30, .35); display: grid; place-items: start center; padding-top: 12vh; z-index: 40; }

@media (max-width: 980px) {

/* Entity lookup for chips, palette and the sheet */
function entity(ref) {
  const [type, id] = ref.split(":");
  switch (type) {
    case "ticket": return TICKETS[id] && { type, id, label: TICKETS[id].title, sub: id, color: "var(--k-ticket)" };
    case "epic": return EPICS[id] && { type, id, label: EPICS[id].title, sub: "Epic", color: PROJECTS[MILESTONES[EPICS[id].ms].project].color };
    case "ms": return MILESTONES[id] && { type, id, label: MILESTONES[id].title, sub: "Milestone", color: PROJECTS[MILESTONES[id].project].color };
    case "orgms": return ORG_MS[id] && { type, id, label: ORG_MS[id].title, sub: "Org milestone", color: "var(--accent)" };
    case "project": return PROJECTS[id] && { type, id, label: PROJECTS[id].name, sub: "Project", color: PROJECTS[id].color };
    case "worker": return WORKERS[id] && { type, id, label: WORKERS[id].name, sub: WORKERS[id].title, color: WORKERS[id].color };
    case "kb": return KB[id] && { type, id, label: KB[id].title, sub: KINDS[KB[id].kind], color: `var(--k-${KB[id].kind})` };
    case "ev": return EVIDENCE[id] && { type, id, label: { check: "Check", quote: "Quote", commit: "Commit" }[EVIDENCE[id].kind], sub: "Evidence", color: "var(--done)" };
    case "run": return RUNS[id] && { type, id, label: `Run on ${RUNS[id].ticket}`, sub: "Run", color: "var(--run)" };
  }
  return null;
}

/* Graph: small seeded force layout, positions kept between renders so dragging sticks */
const POS = {};
function seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

  const vis = kbVisible(), ids = new Set(vis.map(n => n.id));

  const edges = KB_LINKS.filter(([a, b, k]) => ids.has(a) && ids.has(b) && (S.kbSuggested || k !== "suggested")).map(([a, b, k]) => ({ a, b, k }));
  if (S.kbTickets) {
    Object.keys(TICKETS).forEach(t => {

function layout(nodes, edges, W, H) {

  const centers = {}; TOPICS.forEach(t => { centers[t] = [W * spots[t][0], H * spots[t][1]]; });
  const topicOf = n => n.kind === "kb" ? KB[n.id].topic : KB[TICKETS[n.id].used[0]].topic;
  nodes.forEach(n => { if (!POS[n.id]) { const [cx, cy] = centers[topicOf(n)]; POS[n.id] = { x: cx + (rnd() - .5) * 80, y: cy + (rnd() - .5) * 80, fixed: false }; } });
  for (let it = 0; it < 220; it++) {
    const f = {}; nodes.forEach(n => f[n.id] = [0, 0]);
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const A = POS[nodes[i].id], B = POS[nodes[j].id]; let dx = A.x - B.x, dy = A.y - B.y; const d2 = Math.max(dx * dx + dy * dy, 25), d = Math.sqrt(d2);
      const rep = 3400 / d2; f[nodes[i].id][0] += dx / d * rep; f[nodes[i].id][1] += dy / d * rep; f[nodes[j].id][0] -= dx / d * rep; f[nodes[j].id][1] -= dy / d * rep;
    }
    edges.forEach(e => { const A = POS[e.a], B = POS[e.b]; const dx = B.x - A.x, dy = B.y - A.y, d = Math.max(Math.hypot(dx, dy), 1), s = (d - (e.k === "read" ? 70 : 95)) * .025; f[e.a][0] += dx / d * s; f[e.a][1] += dy / d * s; f[e.b][0] -= dx / d * s; f[e.b][1] -= dy / d * s; });
    nodes.forEach(n => { const [cx, cy] = centers[topicOf(n)], P = POS[n.id]; f[n.id][0] += (cx - P.x) * .03; f[n.id][1] += (cy - P.y) * .03; });

}
let laidOutKey = "", laidOutW = 0;
function mountGraph() {
  const svg = $("#graph"); if (!svg) return;
  const W = Math.max(360, Math.round(svg.clientWidth || 960)), H = Math.round(svg.clientHeight || 560);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (laidOutW && Math.abs(W - laidOutW) > 30) Object.values(POS).forEach(P => { P.x *= W / laidOutW; P.fixed = false; });
  const { nodes, edges } = graphModel();

  const t = TICKETS[k]; if (t.status === st) return; const from = t.status; t.status = st;
  if (st === "done" && !t.decision) t.decision = `Accepted by you, ${TODAY.toLocaleDateString(undefined, { month: "short", day: "numeric" })}`;
  render(); toast(why || `${k} moved from ${STATUS[from]} to ${STATUS[st]}. Recorded in activity.`, { label: "Undo", run: () => { t.status = from; if (st === "done") delete t.decision; render(); } });
}
const ACTIONS = {
  theme() { const d = document.documentElement; d.dataset.theme = d.dataset.theme === "dark" ? "light" : "dark"; localStorage.setItem("orgdemo-theme", d.dataset.theme); if (S.tab === "knowledge") renderView(); },
  palette: openPalette,
  sim(btn) { S.sim = !S.sim; btn.setAttribute("aria-pressed", S.sim); btn.innerHTML = `${icon(S.sim ? "pause" : "play")}<span>${S.sim ? "Live demo" : "Paused demo"}</span>`; toast(S.sim ? "Simulated work resumed" : "Simulated work paused"); },
  "hide-hint"() { S.hint = false; renderView(); },
  toast(btn) { toast(btn.dataset.msg); },
  "edit-mission"() { S.editingMission = true; renderView(); $("#missionInput")?.focus(); },
  "cancel-mission"() { S.editingMission = false; renderView(); },
  "save-mission"() { mission = $("#missionInput").value.trim() || mission; S.editingMission = false; renderView(); toast("Mission saved as configuration revision 14"); },
  "approve-req"(btn) { requests = requests.filter(r => r.id !== btn.dataset.id); WORKERS.noor.paused = false; render(); toast("Approved. Noor is no longer held."); },
  "decline-req"(btn) { requests = requests.filter(r => r.id !== btn.dataset.id); render(); toast("Declined. Rem has been told."); },
  "goto-project"(btn) { S.project = btn.dataset.id; closeSheet(); go("projects"); },
  "pick-project"(btn) { S.project = btn.dataset.id; renderView(); },
  "new-project"() { toast("In the real app this asks for a project folder. Not part of the demo."); },
  "board-for-project"(btn) { S.fProject = btn.dataset.id; S.fEpic = "all"; S.board = "tickets"; go("issues"); },
  "epic-board"(btn) { const e = btn.dataset.id; S.fProject = MILESTONES[EPICS[e].ms].project; S.fEpic = e; S.board = "tickets"; S.fWorker = "all"; S.mine = false; go("issues"); },
  board(btn) { S.board = btn.dataset.v; renderView(); },
  mine(el) { S.mine = el.checked; renderView(); },
  group(el) { S.group = el.checked; renderView(); },
  "quick-add"() { S.quickAdd = true; renderView(); $("#quickAdd")?.focus(); },
  "accept-anyway"(btn) { if (confirm(`Accept ${btn.dataset.id} even though some evidence doesn't hold up? This is recorded with your name.`)) setStatus(btn.dataset.id, "done", `${btn.dataset.id} accepted over unverified evidence. Recorded in activity.`); },
  accept(btn) { setStatus(btn.dataset.id, "done", `${btn.dataset.id} accepted. Its epic and milestones now count it.`); },
  revise(btn) { const k = btn.dataset.id; TICKETS[k].claims = []; setStatus(k, "todo", `${k} sent back to To do with your note. Its claims were cleared for the next run.`); },
  "close-sheet": closeSheet,
  "add-worker"() { const id = "w" + Date.now().toString(36); WORKERS[id] = { name: "New worker", title: "Role", reportsTo: "avery", color: "#4d5d6a", provider: "Codex", model: "Provider default", permission: "Read only", paused: true, persona: "", resp: [], runs: 0, tokens: 0 }; renderView(); open(`worker:${id}`, true); toast("Added as held. Give them a persona and responsibilities."); },
  "del-resp"(btn) { syncDraft(); S.workerDraft.resp.splice(+btn.dataset.i, 1); renderSheet(); },
  "save-worker"() {
    syncDraft(); const d = S.workerDraft, w = WORKERS[d.id];
    if (/bypass/i.test(d.permission) && !/bypass/i.test(w.permission) && !confirm(`Give ${d.name} bypass permissions? They could run any command without approval.`)) return;
    const changed = ["name", "title", "persona", "reportsTo", "provider", "permission", "paused"].filter(f => w[f] !== d[f]).concat(JSON.stringify(w.resp) !== JSON.stringify(d.resp) ? ["responsibilities"] : []);
    const { id, ...rest } = d; Object.assign(w, rest); S.workerDraft = null; render();
    toast(`Saved ${w.name}: ${changed.join(", ") || "no changes"}. Recorded as revision 14.`);
  },
  "discard-worker"() { S.workerDraft = null; renderSheet(); },
  "kb-view"(btn) { S.kbView = btn.dataset.v; renderView(); },
  "kb-kind"(btn) { const k = btn.dataset.v; S.kbKinds.has(k) ? S.kbKinds.delete(k) : S.kbKinds.add(k); if (!S.kbKinds.size) S.kbKinds.add(k); renderView(); },
  "kb-suggested"(el) { S.kbSuggested = el.checked; renderView(); },
  "kb-tickets"(el) { S.kbTickets = el.checked; renderView(); },
  "kb-locate"(btn) { S.kbSel = btn.dataset.id; S.kbView = "graph"; S.kbProject = "all"; S.kbKinds = new Set(Object.keys(KINDS)); if (S.tab !== "knowledge") go("knowledge"); else renderView(); },
};
function syncDraft() {
  const f = $("#workerForm"); if (!f || !S.workerDraft) return; const d = S.workerDraft;
  const el = n => f.elements.namedItem(n);
  d.name = el("name").value; d.title = el("title").value; d.persona = el("persona").value; d.reportsTo = el("reportsTo").value || null;
  d.provider = el("provider").value; d.permission = el("permission").value; d.paused = el("paused").checked;
}

/* ---------- Events ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act],[data-open],[data-tab],[data-trail]");
  if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.trail != null) { S.trail = S.trail.slice(0, +t.dataset.trail + 1); S.workerDraft = null; return renderSheet(); }
  if (t.dataset.act && t.tagName !== "SELECT") { if (t.type === "checkbox") return; const fn = ACTIONS[t.dataset.act]; if (fn) { ev.preventDefault(); fn(t); } return; }
  if (t.dataset.open) { const fromSheet = !!t.closest("#sheet"); open(t.dataset.open, !fromSheet); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.filter) { S[el.dataset.filter] = el.value; if (el.dataset.filter === "fProject") S.fEpic = "all"; return renderView(); }
  if (el.type === "checkbox" && el.dataset.act && ACTIONS[el.dataset.act]) return ACTIONS[el.dataset.act](el);
  if (el.dataset.act === "move") return setStatus(el.dataset.id, el.value);
  if (el.closest("#workerForm")) { syncDraft(); renderSheet(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "kbq") { S.kbQuery = ev.target.value; const pos = ev.target.selectionStart; renderView(); const i = $("#kbq"); i.focus(); i.setSelectionRange(pos, pos); }
  if (ev.target.name === "persona") $("#personaCount").textContent = ev.target.value.length;
  if (ev.target.closest && ev.target.closest("#workerForm") && ev.target.tagName !== "SELECT") {
    syncDraft(); const d = S.workerDraft, w = WORKERS[d.id];
    const dirty = JSON.stringify(w) !== JSON.stringify((({ id: _, ...rest }) => rest)(d));
    $("[data-act=save-worker]").disabled = !dirty; $("[data-act=discard-worker]").disabled = !dirty;
    const flag = $(".dirty"); if (dirty && !flag) $(".form-actions").insertAdjacentHTML("beforeend", '<span class="dirty">Unsaved changes</span>'); if (!dirty && flag) flag.remove();
  }
});
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); return openPalette(); }
  if (ev.key === "Escape") { if (!$("#scrim").hidden) return closePalette(); if (S.trail.length) return closeSheet(); }
  if (ev.target.id === "quickAdd") {
    if (ev.key === "Enter" && ev.target.value.trim()) {
      const k = `ORG-${nextTicket++}`, epic = S.fEpic !== "all" ? S.fEpic : (S.fProject !== "all" ? Object.keys(EPICS).find(e => MILESTONES[EPICS[e].ms].project === S.fProject) : "E1");
      TICKETS[k] = T(epic, "backlog", EPICS[epic].owner, ev.target.value.trim()); S.quickAdd = false; render(); toast(`${k} added to Backlog under ${EPICS[epic].title}.`, { label: "Open", run: () => open(`ticket:${k}`, true) });
    }
    if (ev.key === "Escape") { S.quickAdd = false; renderView(); }
  }
  if (ev.target.id === "respInput" && ev.key === "Enter") { ev.preventDefault(); const v = ev.target.value.trim(); if (v) { syncDraft(); S.workerDraft.resp.push(v); renderSheet(); $("#respInput").focus(); } }
  if (ev.target.classList?.contains("card") && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); open(ev.target.dataset.open, true); }
});
/* Drag and drop on the board */
document.addEventListener("dragstart", ev => { const c = ev.target.closest?.(".card"); if (!c) return; ev.dataTransfer.setData("text/plain", c.dataset.key); ev.dataTransfer.effectAllowed = "move"; c.classList.add("dragging"); S.dragging = true; });
document.addEventListener("dragend", ev => { S.dragging = false; ev.target.closest?.(".card")?.classList.remove("dragging"); document.querySelectorAll(".over").forEach(x => x.classList.remove("over")); });
document.addEventListener("dragover", ev => { const col = ev.target.closest?.(".col-body"); if (!col) return; ev.preventDefault(); document.querySelectorAll(".over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", ev => {
  const col = ev.target.closest?.(".col-body"); if (!col) return; ev.preventDefault(); col.classList.remove("over"); S.dragging = false;
  const k = ev.dataTransfer.getData("text/plain"), st = col.dataset.col; if (!TICKETS[k] || !st) return;
  if (st === "done" && TICKETS[k].status !== "review") return toast("Only reviewed work moves to Done. Open the ticket to review it first.");
  if (st === "running") return toast("Workers pick up To do tickets when the organization runs. Move it to To do instead.");
  setStatus(k, st);
});

/* ---------- Palette ---------- */
let pItems = [], pIdx = 0;
function openPalette() { $("#scrim").hidden = false; $("#pq").value = ""; fillPalette(""); $("#pq").focus(); }
function closePalette() { $("#scrim").hidden = true; }
function fillPalette(q) {
  const refs = [...Object.keys(TICKETS).map(k => `ticket:${k}`), ...Object.keys(EPICS).map(k => `epic:${k}`), ...Object.keys(MILESTONES).map(k => `ms:${k}`), ...Object.keys(ORG_MS).map(k => `orgms:${k}`), ...Object.keys(PROJECTS).map(k => `project:${k}`), ...Object.keys(WORKERS).map(k => `worker:${k}`), ...Object.keys(KB).map(k => `kb:${k}`)];
  const s = q.trim().toLowerCase();
  pItems = refs.map(entity).filter(e => !s || (e.label + " " + e.id + " " + e.sub).toLowerCase().includes(s)).slice(0, 12); pIdx = 0;
  $("#pl").innerHTML = pItems.map((e, i) => `<li><button type="button" role="option" aria-selected="${i === pIdx}" data-pi="${i}"><span class="type">${h(e.type === "ticket" ? "Ticket" : e.sub)}</span><span>${e.type === "ticket" ? `<span class="key muted">${e.id}</span> ` : ""}${h(e.label)}</span><i class="dot" style="color:${e.color}"></i></button></li>`).join("") || `<li class="empty">Nothing matches</li>`;
}
$("#pq").addEventListener("input", e => fillPalette(e.target.value));
$("#pq").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); pIdx = (pIdx + (e.key === "ArrowDown" ? 1 : -1) + pItems.length) % Math.max(pItems.length, 1); document.querySelectorAll("#pl button").forEach((b, i) => b.setAttribute("aria-selected", i === pIdx)); document.querySelector(`#pl [data-pi="${pIdx}"]`)?.scrollIntoView({ block: "nearest" }); }
  if (e.key === "Enter" && pItems[pIdx]) { closePalette(); const it = pItems[pIdx]; open(`${it.type}:${it.id}`, true); }
});
$("#pl").addEventListener("click", e => { const b = e.target.closest("[data-pi]"); if (!b) return; closePalette(); const it = pItems[+b.dataset.pi]; open(`${it.type}:${it.id}`, true); });
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closePalette(); });

/* ---------- Simulated agent work: ORG-14 runs, then asks for review ---------- */
setInterval(() => {
  if (!S.sim) return;
  const r = RUNS.R2; if (!r.live) return;
  r.step = (r.step || 0) + 1; r.mins += 3; r.tokens += 9;
  const t = TICKETS["ORG-14"];
  if (r.step >= r.steps.length) {
    r.live = false; r.when = "Today, just now"; t.status = "review";
    t.diff = { files: [["src/gofer/ui/organization_checks.py", 96, 0], ["tests/unit/test_organization_checks.py", 120, 0]] };
    EVIDENCE.EV20 = { kind: "check", state: "ok", cmd: "pytest tests/unit/test_organization_checks.py", exit: 0, by: "Raticode reran it in the task's worktree", when: "just now", out: "11 passed in 1.2s" };
    EVIDENCE.EV21 = { kind: "quote", state: "ok", source: "K6", when: "quoted just now", now: "Artifacts record the agent's claimed result; nothing reruns the check." };
    t.claims = [{ text: "A claim counts as verified only after Raticode reruns its check", ev: "EV20" }, { text: "Addresses the self-reported checks finding", ev: "EV21" }];
    toast("ORG-14 finished and is ready for your review.", { label: "Review", run: () => open("ticket:ORG-14", true) });
  }
  // Never redraw under someone typing or dragging; only touch what the run changed.
  const a = document.activeElement, typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  renderTabs();
  if (!typing && !S.dragging && S.tab !== "knowledge" && S.tab !== "projects") renderView();
  if (!typing && (S.trail.at(-1) === "ticket:ORG-14" || S.trail.at(-1) === "run:R2")) renderSheet();
}, 4000);

/* ---------- Start ---------- */
const saved = localStorage.getItem("orgdemo-theme");
if (saved) document.documentElement.dataset.theme = saved; else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
if (!TABS.some(([id]) => id === S.tab)) S.tab = "org";
render();
// Re-fit the graph when the sheet docks or the window resizes.
let fitTimer = 0;
new ResizeObserver(() => { if (S.tab !== "knowledge" || S.kbView !== "graph") return; clearTimeout(fitTimer); fitTimer = setTimeout(mountGraph, 120); }).observe($("#view"));
</script>
