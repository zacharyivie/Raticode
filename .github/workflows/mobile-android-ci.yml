name: Mobile Android CI

# Stage pushes run these checks as the first job of mobile-release-candidate.yml, and tags
# publish through mobile-release.yml, so neither starts this workflow directly.
on:
  push:
    branches: [main, dev]
    paths:
      - 'mobile/android/**'
      - 'src/gofer/devices/protocol/**'
      - 'scripts/device_tls_probe.py'
      - '.github/workflows/mobile-*.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - 'src/gofer/devices/protocol/**'
      - 'scripts/device_tls_probe.py'
      - '.github/workflows/mobile-*.yml'
  # Only the default branch writes the Gradle cache, and caches expire after seven idle days.
  schedule:
    - cron: '17 6 */5 * *'
  workflow_call:
  workflow_dispatch:
    inputs:
      emulator-tests:
        description: Also run the instrumented tests on an emulator
        type: boolean
        default: false
      desktop-fixture-test:
        description: Also run the emulator test against this checkout's desktop code
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile/android

# A stage candidate's checks are never cancelled by a later push; each commit gets its own.
concurrency:
  group: android-ci-${{ github.ref == 'refs/heads/stage' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stage' }}

jobs:
  checks:
    name: Version, scripts and protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check the version
        run: python scripts/version.py check

      - name: Test the scripts
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Install protocol check dependencies
        run: pip install -r protocol/requirements.txt

      - name: Validate protocol schemas and fixtures
        run: python scripts/check-contract.py

  android:
    name: Build, unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      # Also validates the committed Gradle wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # No RATICODE_RELEASE_* signing variables exist here, so the release APK is unsigned.
      - name: Build, test and lint debug and release
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease lintRelease --console=plain

      - name: Check the debug APK carries version.properties
        run: |
          name=$(python3 scripts/version.py show --field name)
          code=$(python3 scripts/version.py show --field code)
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk)
          badging=${badging%%$'\n'*}
          echo "$badging"
          grep -Fq "versionCode='$code'" <<<"$badging" && grep -Fq "versionName='$name-debug'" <<<"$badging"

      # Same release checks a stage candidate gets: version, SDK levels, not debuggable,
      # backups and cleartext off, and the reviewed permissions and exported components.
      - name: Check the release APK against the release policy
        run: python3 scripts/release-candidate.py check-apk --signing unsigned

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raticode-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
          retention-days: 14

  emulator:
    name: Instrumented tests (emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.emulator-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Tests that need the host desktop fixture (mobile/android/scripts/live-device-fixture.py) skip themselves here.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # The UI tests are written against a Pixel 8 screen (1080x2400, 420 dpi).
          # The runner's avdmanager has no pixel_8, so use pixel_6, which has the
          # same screen. The default AVD's small screen and memory hide controls,
          # break swipes and crash the run.
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          working-directory: ./mobile/android
          script: ./gradlew connectedDebugAndroidTest --console=plain

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumented-reports
          path: mobile/android/app/build/reports/androidTests/
          retention-days: 14

  desktop-fixture:
    name: Emulator against this desktop code
    if: github.event_name == 'workflow_dispatch' && inputs.desktop-fixture-test
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install locked Python dependencies
        working-directory: .
        run: uv sync --locked --extra dev --extra xlsx --group dev

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the emulator test against this desktop code
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # The UI tests are written against a Pixel 8 screen (1080x2400, 420 dpi).
          # The runner's avdmanager has no pixel_8, so use pixel_6, which has the
          # same screen. The default AVD's small screen and memory hide controls,
          # break swipes and crash the run.
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          working-directory: ./mobile/android
          script: ./scripts/run-desktop-fixture-test.sh
