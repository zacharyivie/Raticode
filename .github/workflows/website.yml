name: Website docs

# The website is the single source of truth for Raticode documentation.
# - docs-gate: a pull request that adds a feature (a feat: commit or title) and changes
#   app code must also change website/, unless a commit or the pull request says
#   "Docs-not-needed: <reason>". See scripts/check-website-docs.py.
# - build: type-checks and builds the site and checks its internal links, sitemap,
#   robots.txt, page titles, canonical links and link preview tags when website/ changes.
#   Every run except a pull request also checks that the download links match the newest
#   published desktop release and that the signed phone APK the site links exists on its
#   published mobile release.
# - deploy: publishes the built site to GitHub Pages, only from main, only after every
#   check above passed. It runs on pushes to main that change the site, when the
#   "Publish release" or "Publish mobile release" workflow finishes successfully, and from
#   Run workflow on main. If the site names a desktop or phone release that isn't published
#   yet (it is moved to new versions before their tags publish them), check:downloads exits
#   3, the run waits, and the deploy happens when the last of those publish workflows
#   finishes, so the live site never links a missing download.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables), optional:
#   WEBSITE_URL   full site address; default https://raticode.dev/
#   WEBSITE_BASE  path the site is served from; default is the path of WEBSITE_URL
# For another domain set WEBSITE_URL=https://<domain>/ and leave WEBSITE_BASE unset.
# Pages must use "GitHub Actions" as its source (Settings > Pages). See docs/releasing.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, dev]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_run:
    workflows: ["Publish release", "Publish mobile release"]
    types: [completed]
  schedule:
    - cron: '41 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-gate:
    name: Website docs updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that features update the website
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.txt"
          python3 scripts/check-website-docs.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            --pr-text-file "$RUNNER_TEMP/pr.txt"

  changes:
    name: Detect website changes
    # A release that failed publishes nothing, so there is nothing new to deploy. Only a
    # tag push in this repository counts, not a fork's workflow with the same name.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      website: ${{ steps.diff.outputs.website }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List changed website files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...HEAD" | grep -qE '^(website/|\.github/workflows/website\.yml$)'; then
            echo "website=true" >> "$GITHUB_OUTPUT"
          else
            echo "website=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and check website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    env:
      WEBSITE_URL: ${{ vars.WEBSITE_URL }}
      WEBSITE_BASE: ${{ vars.WEBSITE_BASE }}
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so each sitemap entry's lastmod is the date its page last changed.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Type-check, build and check internal links
        run: npm run check

      - name: Check download links match the newest release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          status=0
          npm run --silent check:downloads || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::notice title=Website waits for its release::The site names a desktop or phone release that isn't published yet. It deploys when Publish release or Publish mobile release finishes and every download it links is public."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          case "$EVENT" in
            push|workflow_dispatch|workflow_run) ;;
            *) echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ "$REF" = refs/heads/main ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the site for GitHub Pages
        if: steps.release.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
