name: Prepare release packages

on:
  workflow_call:
    inputs:
      signed_release:
        description: Require Windows signing and Apple signing/notarization
        type: boolean
        default: false
    outputs:
      signed_release:
        description: Signing policy used to build this candidate
        value: ${{ jobs.credentials.outputs.signed_release }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    uses: ./.github/workflows/validate-source.yml

  credentials:
    name: Check signing configuration
    runs-on: ubuntu-24.04
    environment: ${{ inputs.signed_release && 'release-signing' || 'release-unsigned' }}
    outputs:
      signed_release: ${{ steps.policy.outputs.signed_release }}
    steps:
      - name: Record signing policy
        id: policy
        env:
          SIGNED_RELEASE: ${{ inputs.signed_release }}
        run: echo "signed_release=$SIGNED_RELEASE" >> "$GITHUB_OUTPUT"
      - name: Check all required settings without printing values
        if: inputs.signed_release
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ inputs.signed_release && vars.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          python - <<'PYCODE'
          import os
          names = ('WINDOWS_CERTIFICATE', 'WINDOWS_CERTIFICATE_PASSWORD',
                   'MACOS_CERTIFICATE', 'MACOS_CERTIFICATE_PASSWORD',
                   'APPLE_APP_SPECIFIC_PASSWORD', 'MACOS_SIGNING_IDENTITY',
                   'APPLE_ID', 'APPLE_TEAM_ID')
          missing = [name for name in names if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing release-signing settings: ' + ', '.join(missing))
          print('All eight signing settings are present. Native builds will verify them.')
          PYCODE

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, credentials]
    environment: ${{ inputs.signed_release && 'release-signing' || 'release-unsigned' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            electron_builder_args: --linux AppImage deb rpm --x64
            artifact-name: gofer-flow-linux
            artifact-glob: |
              frontend/release/*.AppImage
              frontend/release/*.AppImage.blockmap
              frontend/release/*.deb
              frontend/release/*.rpm
              frontend/release/latest-linux.yml
              frontend/release/gof-linux-x64
              frontend/release/checksums-linux.txt
              frontend/release/package-tests-linux.json
          - name: windows
            os: windows-2022
            electron_builder_args: --win nsis --x64
            artifact-name: gofer-flow-windows
            artifact-glob: |
              frontend/release/*.exe
              frontend/release/*.exe.blockmap
              frontend/release/latest.yml
              frontend/release/checksums-windows.txt
              frontend/release/package-tests-windows.json
              frontend/release/signatures-windows.json
          - name: macos
            os: macos-15
            electron_builder_args: --mac dmg zip --arm64
            artifact-name: gofer-flow-macos
            artifact-glob: |
              frontend/release/*.dmg
              frontend/release/*.dmg.blockmap
              frontend/release/*.zip
              frontend/release/*.zip.blockmap
              frontend/release/latest-mac.yml
              frontend/release/gof-macos-*
              frontend/release/checksums-macos.txt
              frontend/release/package-tests-macos.json
              frontend/release/notarization-macos-*.json

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm xvfb libarchive-tools

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra xlsx --group dev

      - name: Test platform filesystem security
        run: uv run --locked pytest tests/unit/test_atomic_output.py tests/unit/test_native_filesystem_security.py tests/unit/test_resource_security.py tests/unit/test_rattish_workspaces.py

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Require Windows signing credentials
        env:
          CSC_LINK: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD) || '' }}
        if: inputs.signed_release && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw "Release requires WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD."
          }

      - name: Prepare macOS signing keychain
        env:
          CSC_LINK: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD) || '' }}
          APPLE_ID: ${{ inputs.signed_release && runner.os == 'macOS' && vars.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed_release && runner.os == 'macOS' && vars.APPLE_TEAM_ID || '' }}
          GOFER_CODESIGN_IDENTITY: ${{ inputs.signed_release && vars.MACOS_SIGNING_IDENTITY || '' }}
        if: inputs.signed_release && runner.os == 'macOS'
        shell: bash
        run: scripts/prepare-macos-signing.sh

      - name: Build backend
        working-directory: frontend
        env:
          GOFER_CODESIGN_IDENTITY: ${{ inputs.signed_release && runner.os == 'macOS' && vars.MACOS_SIGNING_IDENTITY || '' }}
        run: npm run backend:build

      - name: Sign Windows backend before packaging
        env:
          CSC_LINK: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD) || '' }}
        if: inputs.signed_release && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/sign-windows-backend.ps1

      - name: Build Electron packages
        working-directory: frontend
        shell: bash
        env:
          CSC_LINK: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed_release && (runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || runner.os == 'macOS' && secrets.MACOS_CERTIFICATE_PASSWORD) || '' }}
          APPLE_ID: ${{ inputs.signed_release && runner.os == 'macOS' && vars.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed_release && runner.os == 'macOS' && vars.APPLE_TEAM_ID || '' }}
          SIGNED_RELEASE: ${{ inputs.signed_release }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.signed_release }}
        run: |
          # Empty CSC_LINK is treated as a file path by electron-builder.
          if [ "$SIGNED_RELEASE" != "true" ] || [ "$RUNNER_OS" = "Linux" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npm run build
          signing_args=(--config.extraMetadata.raticodeReleaseSigning=unsigned)
          if [ "$SIGNED_RELEASE" = "true" ] && [ "$RUNNER_OS" != "Linux" ]; then
            signing_args=(--config.forceCodeSigning=true --config.extraMetadata.raticodeReleaseSigning=signed)
            if [ "$RUNNER_OS" = "macOS" ]; then
              signing_args+=(--config.mac.notarize=true --config.dmg.sign=true)
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            signing_args+=(--config.forceCodeSigning=false)
            if [ "$RUNNER_OS" = "macOS" ]; then
              # Apple Silicon still needs an ad-hoc signature to run locally.
              signing_args+=(--config.mac.identity=- --config.mac.notarize=false --config.dmg.sign=false)
            fi
          fi
          npx --no-install electron-builder ${{ matrix.electron_builder_args }} "${signing_args[@]}" --publish=never

      - name: Test native terminal and Electron security on packaged runtime version
        working-directory: frontend
        run: npm run test:platform

      - name: Delete temporary macOS signing keychain
        if: always() && inputs.signed_release && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/raticode-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/raticode-signing.p12"

      - name: Copy Linux CLI artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp dist/gof frontend/release/gof-linux-x64
          chmod +x frontend/release/gof-linux-x64

      - name: Build Linux CLI packages
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/package-cli-linux.sh dist/gof frontend/release

      - name: Copy Windows CLI artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/gof.exe frontend/release/gof-windows-x64.exe

      - name: Copy macOS CLI artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch="$(uname -m)"
          case "$arch" in
            arm64) artifact_arch="arm64" ;;
            x86_64) artifact_arch="x64" ;;
            *) artifact_arch="$arch" ;;
          esac
          cp dist/gof "frontend/release/gof-macos-${artifact_arch}"
          chmod +x "frontend/release/gof-macos-${artifact_arch}"

      - name: Verify Windows release signatures
        if: inputs.signed_release && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1

      - name: Verify macOS signatures and notarization
        env:
          APPLE_ID: ${{ inputs.signed_release && runner.os == 'macOS' && vars.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed_release && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed_release && runner.os == 'macOS' && vars.APPLE_TEAM_ID || '' }}
        if: inputs.signed_release && runner.os == 'macOS'
        shell: bash
        run: scripts/verify-macos-release.sh

      - name: Verify final updater hashes
        run: node scripts/verify-update-metadata.cjs

      - name: Smoke-test final distributions
        run: python scripts/test-release-packages.py

      - name: Generate Linux checksums
        if: runner.os == 'Linux'
        working-directory: frontend/release
        shell: bash
        run: |
          files=()
          for pattern in *.AppImage *.AppImage.blockmap *.deb *.rpm latest-linux.yml gof-linux-x64 package-tests-linux.json; do
            for file in $pattern; do
              [ -e "$file" ] && files+=("$file")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Linux release files found for checksums" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums-linux.txt
          cat checksums-linux.txt

      - name: Generate Windows checksums
        if: runner.os == 'Windows'
        working-directory: frontend/release
        shell: pwsh
        run: |
          Get-ChildItem -File |
            Where-Object { $_.Name -like "*.exe" -or $_.Name -like "*.exe.blockmap" -or $_.Name -eq "latest.yml" -or $_.Name -eq "signatures-windows.json" -or $_.Name -eq "package-tests-windows.json" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 $_.FullName
              "$($hash.Hash.ToLower())  $($_.Name)"
            } | Set-Content checksums-windows.txt
          Get-Content checksums-windows.txt

      - name: Generate macOS checksums
        if: runner.os == 'macOS'
        working-directory: frontend/release
        shell: bash
        run: |
          files=()
          for pattern in *.dmg *.dmg.blockmap *.zip *.zip.blockmap latest-mac.yml gof-macos-* notarization-macos-*.json package-tests-macos.json; do
            for file in $pattern; do
              [ -e "$file" ] && files+=("$file")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No macOS release files found for checksums" >&2
            exit 1
          fi
          shasum -a 256 "${files[@]}" > checksums-macos.txt
          cat checksums-macos.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0 (Node 24)
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          # A rerun may replace temporary Actions artifacts; staged release files stay immutable.
          overwrite: true
