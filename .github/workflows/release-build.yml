name: Prepare release packages

on:
  workflow_call:
    inputs:
      macos_signing:
        description: Require Developer ID signing, notarization and stapling of the Mac packages
        type: boolean
        default: false
      windows_signing:
        description: Require Authenticode signing of the Windows packages
        type: boolean
        default: false
    outputs:
      macos_signed:
        description: Whether the Mac packages were built with the Developer ID policy
        value: ${{ jobs.credentials.outputs.macos_signed }}
      windows_signed:
        description: Whether the Windows packages were built with the signing policy
        value: ${{ jobs.credentials.outputs.windows_signed }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    uses: ./.github/workflows/validate-source.yml

  credentials:
    name: Check signing configuration
    runs-on: ubuntu-24.04
    environment: ${{ (inputs.macos_signing || inputs.windows_signing) && 'release-signing' || 'release-unsigned' }}
    outputs:
      macos_signed: ${{ steps.policy.outputs.macos_signed }}
      windows_signed: ${{ steps.policy.outputs.windows_signed }}
    steps:
      - name: Record signing policy
        id: policy
        env:
          MACOS_SIGNING: ${{ inputs.macos_signing }}
          WINDOWS_SIGNING: ${{ inputs.windows_signing }}
        run: |
          echo "macos_signed=$MACOS_SIGNING" >> "$GITHUB_OUTPUT"
          echo "windows_signed=$WINDOWS_SIGNING" >> "$GITHUB_OUTPUT"
          if [ "$MACOS_SIGNING" != "true" ]; then
            echo "::warning title=Unsigned macOS build::This run builds unsigned Mac packages. They can't be published as a release."
          fi
      # Only presence is checked here. The macOS job checks the certificate and Apple
      # account themselves before it builds anything.
      - name: Check all required settings without printing values
        if: inputs.macos_signing || inputs.windows_signing
        env:
          MACOS_SIGNING: ${{ inputs.macos_signing }}
          WINDOWS_SIGNING: ${{ inputs.windows_signing }}
          WINDOWS_CERTIFICATE: ${{ inputs.windows_signing && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.windows_signing && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          MACOS_CERTIFICATE: ${{ inputs.macos_signing && (secrets.MACOS_CERTIFICATE || secrets.APPLE_CERTIFICATE_P12_BASE64 || secrets.CSC_LINK) || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ inputs.macos_signing && (secrets.MACOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ inputs.macos_signing && (secrets.APPLE_ID || vars.APPLE_ID) || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.macos_signing && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          python - <<'PYCODE'
          import os
          required = []
          if os.environ.get('MACOS_SIGNING') == 'true':
              required += [('MACOS_CERTIFICATE', 'APPLE_CERTIFICATE_P12_BASE64 or CSC_LINK'),
                           ('MACOS_CERTIFICATE_PASSWORD', 'APPLE_CERTIFICATE_PASSWORD or CSC_KEY_PASSWORD'),
                           ('APPLE_ID', None), ('APPLE_APP_SPECIFIC_PASSWORD', None)]
          if os.environ.get('WINDOWS_SIGNING') == 'true':
              required += [('WINDOWS_CERTIFICATE', None), ('WINDOWS_CERTIFICATE_PASSWORD', None)]
          missing = [name + (f' (or {other})' if other else '')
                     for name, other in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing release-signing secrets: ' + ', '.join(missing))
          print(f'All {len(required)} required signing secrets are present. Native builds will verify them.')
          PYCODE

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, credentials]
    # Only a platform that signs enters the signing environment.
    environment: ${{ (matrix.name == 'macos' && inputs.macos_signing || matrix.name == 'windows' && inputs.windows_signing) && 'release-signing' || 'release-unsigned' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            electron_builder_args: --linux AppImage deb rpm --x64
            artifact-name: raticode-linux
            artifact-glob: |
              frontend/release/*.AppImage
              frontend/release/*.AppImage.blockmap
              frontend/release/*.deb
              frontend/release/*.rpm
              frontend/release/latest-linux.yml
              frontend/release/raticode-cli-linux-x64
              frontend/release/checksums-linux.txt
              frontend/release/package-tests-linux.json
          - name: windows
            os: windows-2022
            electron_builder_args: --win nsis --x64
            artifact-name: raticode-windows
            artifact-glob: |
              frontend/release/*.exe
              frontend/release/*.exe.blockmap
              frontend/release/latest.yml
              frontend/release/checksums-windows.txt
              frontend/release/package-tests-windows.json
              frontend/release/signatures-windows.json
          - name: macos
            os: macos-15
            electron_builder_args: --mac dmg zip --arm64
            artifact-name: raticode-macos
            artifact-glob: |
              frontend/release/*.dmg
              frontend/release/*.dmg.blockmap
              frontend/release/*.zip
              frontend/release/*.zip.blockmap
              frontend/release/latest-mac.yml
              frontend/release/raticode-cli-macos-*
              frontend/release/checksums-macos.txt
              frontend/release/package-tests-macos.json
              frontend/release/notarization-macos-*.json

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm xvfb libarchive-tools

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --extra dev --extra xlsx --group dev

      - name: Test platform filesystem security
        run: uv run --locked pytest tests/unit/test_atomic_output.py tests/unit/test_native_filesystem_security.py tests/unit/test_resource_security.py tests/unit/test_rattish_workspaces.py

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Electron 42+ no longer downloads its runtime during npm ci. Tests and
      # the license bundle need it, including Chromium's notices.
      - name: Download the Electron runtime
        working-directory: frontend
        run: node node_modules/electron/install.js

      - name: Require Windows signing credentials
        env:
          CSC_LINK: ${{ inputs.windows_signing && runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.windows_signing && runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        if: inputs.windows_signing && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw "Release requires WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD."
          }

      # The only step that sees the Apple secrets. It imports the certificate into a
      # temporary keychain, stores notarytool's credentials there, and outputs only the
      # identity hash, team ID and keychain path. Later steps sign through that keychain.
      - name: Prepare macOS signing keychain
        id: macos-signing
        env:
          MACOS_CERTIFICATE: ${{ inputs.macos_signing && runner.os == 'macOS' && (secrets.MACOS_CERTIFICATE || secrets.APPLE_CERTIFICATE_P12_BASE64 || secrets.CSC_LINK) || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ inputs.macos_signing && runner.os == 'macOS' && (secrets.MACOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD) || '' }}
          APPLE_ID: ${{ inputs.macos_signing && runner.os == 'macOS' && (secrets.APPLE_ID || vars.APPLE_ID) || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.macos_signing && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.macos_signing && runner.os == 'macOS' && (secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID) || '' }}
          MACOS_SIGNING_IDENTITY: ${{ inputs.macos_signing && runner.os == 'macOS' && (secrets.MACOS_SIGNING_IDENTITY || vars.MACOS_SIGNING_IDENTITY) || '' }}
        if: inputs.macos_signing && runner.os == 'macOS'
        run: uv run --locked python scripts/macos-release-signing.py prepare

      - name: Build backend
        working-directory: frontend
        env:
          GOFER_CODESIGN_IDENTITY: ${{ steps.macos-signing.outputs.identity }}
          GOFER_CODESIGN_ENTITLEMENTS: ${{ steps.macos-signing.outputs.identity && 'frontend/build-resources/entitlements.mac.plist' || '' }}
        run: npm run backend:build

      - name: Sign Windows backend before packaging
        env:
          CSC_LINK: ${{ inputs.windows_signing && runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.windows_signing && runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        if: inputs.windows_signing && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/sign-windows-backend.ps1

      # electron-builder skips a missing extraResources file without failing, so a Mac
      # package built without this step has no dictation helper.
      - name: Build macOS speech helper
        if: runner.os == 'macOS'
        run: node scripts/build-macos-speech-helper.cjs --require

      - name: Build Electron packages
        working-directory: frontend
        shell: bash
        env:
          CSC_LINK: ${{ inputs.windows_signing && runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.windows_signing && runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          # electron-builder signs with the identity in the temporary keychain and
          # notarizes and staples the app through notarytool's stored profile.
          CSC_NAME: ${{ steps.macos-signing.outputs.identity }}
          CSC_KEYCHAIN: ${{ steps.macos-signing.outputs.keychain }}
          APPLE_KEYCHAIN: ${{ steps.macos-signing.outputs.keychain }}
          APPLE_KEYCHAIN_PROFILE: ${{ steps.macos-signing.outputs.notary-profile }}
          MACOS_SIGNING: ${{ inputs.macos_signing }}
          WINDOWS_SIGNING: ${{ inputs.windows_signing }}
        run: |
          # electron-builder reads an empty CSC_LINK as a file path, so drop empty values.
          for name in CSC_LINK CSC_KEY_PASSWORD CSC_NAME CSC_KEYCHAIN APPLE_KEYCHAIN APPLE_KEYCHAIN_PROFILE; do
            [ -n "${!name:-}" ] || unset "$name"
          done
          # Notarization uses only the keychain profile; never the Apple ID variables.
          unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          npm run build
          case "$RUNNER_OS" in
            macOS) signed="$MACOS_SIGNING" ;;
            Windows) signed="$WINDOWS_SIGNING" ;;
            *) signed=false ;;
          esac
          if [ "$signed" = "true" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            signing_args=(--config.forceCodeSigning=true --config.extraMetadata.raticodeReleaseSigning=signed)
            if [ "$RUNNER_OS" = "macOS" ]; then
              if [ -z "${CSC_NAME:-}" ] || [ -z "${CSC_KEYCHAIN:-}" ] || [ -z "${APPLE_KEYCHAIN_PROFILE:-}" ]; then
                echo "::error::Signed macOS build has no prepared signing keychain." >&2
                exit 1
              fi
              # The DMG is signed with a secure timestamp, notarized and stapled afterwards.
              signing_args+=(--config.mac.hardenedRuntime=true --config.mac.notarize=true --config.dmg.sign=false)
            fi
          else
            unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME CSC_KEYCHAIN APPLE_KEYCHAIN APPLE_KEYCHAIN_PROFILE
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            signing_args=(--config.forceCodeSigning=false --config.extraMetadata.raticodeReleaseSigning=unsigned)
            if [ "$RUNNER_OS" = "macOS" ]; then
              echo "::warning title=Unsigned macOS build::Building an unsigned, ad-hoc signed Mac app. It is not notarized and can't be published."
              # Apple Silicon still needs an ad-hoc signature to run locally.
              signing_args+=(--config.mac.identity=- --config.mac.notarize=false --config.dmg.sign=false)
            fi
          fi
          npx --no-install electron-builder ${{ matrix.electron_builder_args }} "${signing_args[@]}" --publish=never

      - name: Test native terminal and Electron security on packaged runtime version
        working-directory: frontend
        run: npm run test:platform

      - name: Copy Linux CLI artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp dist/Raticode frontend/release/raticode-cli-linux-x64
          chmod +x frontend/release/raticode-cli-linux-x64

      - name: Build Linux CLI packages
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/package-cli-linux.sh dist/Raticode frontend/release

      - name: Copy Windows CLI artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/Raticode.exe frontend/release/raticode-cli-windows-x64.exe

      - name: Copy macOS CLI artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch="$(uname -m)"
          case "$arch" in
            arm64) artifact_arch="arm64" ;;
            x86_64) artifact_arch="x64" ;;
            *) artifact_arch="$arch" ;;
          esac
          cp dist/Raticode "frontend/release/raticode-cli-macos-${artifact_arch}"
          chmod +x "frontend/release/raticode-cli-macos-${artifact_arch}"

      - name: Verify Windows release signatures
        if: inputs.windows_signing && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-release.ps1

      # Checks the app and its nested backend and speech helper, then notarizes and
      # staples the DMG, rebuilds its blockmap and updater entry, and notarizes the CLI.
      - name: Verify macOS signatures and notarization
        env:
          RATICODE_IDENTITY: ${{ steps.macos-signing.outputs.identity }}
          RATICODE_TEAM_ID: ${{ steps.macos-signing.outputs.team-id }}
          RATICODE_KEYCHAIN: ${{ steps.macos-signing.outputs.keychain }}
          RATICODE_NOTARY_PROFILE: ${{ steps.macos-signing.outputs.notary-profile }}
        if: inputs.macos_signing && runner.os == 'macOS'
        run: uv run --locked python scripts/macos-release-signing.py verify

      - name: Delete temporary macOS signing keychain
        if: always() && inputs.macos_signing && runner.os == 'macOS'
        run: python3 scripts/macos-release-signing.py cleanup

      - name: Verify final updater hashes
        run: node scripts/verify-update-metadata.cjs

      - name: Smoke-test final distributions
        env:
          RATICODE_MACOS_SIGNING: ${{ inputs.macos_signing && 'developer-id' || 'unsigned' }}
          RATICODE_MACOS_TEAM_ID: ${{ steps.macos-signing.outputs.team-id }}
        run: uv run --locked python scripts/test-release-packages.py

      - name: Generate Linux checksums
        if: runner.os == 'Linux'
        working-directory: frontend/release
        shell: bash
        run: |
          files=()
          for pattern in *.AppImage *.AppImage.blockmap *.deb *.rpm latest-linux.yml raticode-cli-linux-x64 package-tests-linux.json; do
            for file in $pattern; do
              [ -e "$file" ] && files+=("$file")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Linux release files found for checksums" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums-linux.txt
          cat checksums-linux.txt

      - name: Generate Windows checksums
        if: runner.os == 'Windows'
        working-directory: frontend/release
        shell: pwsh
        run: |
          Get-ChildItem -File |
            Where-Object { $_.Name -like "*.exe" -or $_.Name -like "*.exe.blockmap" -or $_.Name -eq "latest.yml" -or $_.Name -eq "signatures-windows.json" -or $_.Name -eq "package-tests-windows.json" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 $_.FullName
              "$($hash.Hash.ToLower())  $($_.Name)"
            } | Set-Content checksums-windows.txt
          Get-Content checksums-windows.txt

      - name: Generate macOS checksums
        if: runner.os == 'macOS'
        working-directory: frontend/release
        shell: bash
        run: |
          files=()
          for pattern in *.dmg *.dmg.blockmap *.zip *.zip.blockmap latest-mac.yml raticode-cli-macos-* notarization-macos-*.json package-tests-macos.json; do
            for file in $pattern; do
              [ -e "$file" ] && files+=("$file")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No macOS release files found for checksums" >&2
            exit 1
          fi
          shasum -a 256 "${files[@]}" > checksums-macos.txt
          cat checksums-macos.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          # A rerun may replace temporary Actions artifacts; staged release files stay immutable.
          overwrite: true
