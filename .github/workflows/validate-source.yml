name: Validate source

on:
  pull_request:
    paths-ignore:
      - 'mobile/android/**'
      - '.github/workflows/mobile-*.yml'
      - 'website/**'
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked --extra dev --extra xlsx --group dev

      - name: Lint Python
        run: uv run --locked ruff check src tests

      - name: Type-check Python
        run: uv run --locked mypy src tests

      - name: Test Python
        run: uv run --locked pytest

      - name: Audit all locked Python platform dependencies
        run: uv run --locked python scripts/audit-dependencies.py

      - name: Verify package versions agree
        run: python scripts/release-candidate.py versions

      - name: Install browser runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg
          # Ubuntu 24.04 lets only programs with an AppArmor profile create user
          # namespaces. Chrome ships one; Edge doesn't, so its sandbox aborts on the
          # runner ("SUID sandbox helper ... not configured correctly") and the real
          # Edge tests fail. Allow user namespaces for this disposable runner.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Electron 42+ no longer downloads its runtime during npm ci. Tests and
      # the license bundle need it, including Chromium's notices.
      - name: Download the Electron runtime
        working-directory: frontend
        run: node node_modules/electron/install.js

      - name: Verify third-party license bundle
        run: uv run --locked --extra xlsx python scripts/collect-licenses.py

      - name: Audit frontend and shipped Electron dependencies
        working-directory: frontend
        run: |
          mkdir -p ../audit-evidence
          audit_status=0
          npm audit --include=peer --audit-level=low --json > ../audit-evidence/npm-audit.json || audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            cat ../audit-evidence/npm-audit.json
            # Allows only reviewed, expiring advisories in development-only build tools.
            python ../scripts/check-npm-audit.py ../audit-evidence/npm-audit.json
          fi

      - name: Save dependency audit evidence
        # Earlier validation failures can skip both audits entirely.
        if: always() && hashFiles('audit-evidence/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raticode-audit-evidence
          path: audit-evidence/*
          if-no-files-found: error
          # A rerun may replace temporary Actions artifacts; staged release files stay immutable.
          overwrite: true

      - name: Lint frontend source
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Browser-test workflow studio
        working-directory: frontend
        run: xvfb-run -a npm run test:browser
