name: Prepare release candidate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate source and prepare candidate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-build.yml
    with:
      signed_release: ${{ vars.RELEASE_SIGNING == 'true' }}
    secrets: inherit

  stage:
    name: Stage exact files
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Download this run's packages and evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gofer-flow-*
          path: candidate-input
      - name: Create candidate manifest and verify completeness
        env:
          SIGNED_RELEASE: ${{ needs.prepare.outputs.signed_release }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-candidate.py manifest
      - name: Attest all desktop, CLI, checksum and audit artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/*
      - name: Upload draft and verify every remote asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-candidate.py stage
