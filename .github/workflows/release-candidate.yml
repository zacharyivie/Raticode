name: Prepare release candidate

# Release checks and candidates run on stage. Main receives a reviewed candidate by
# squash merge, then a v* tag publishes it (see docs/releasing.md).
on:
  push:
    branches:
      - stage
    paths-ignore:
      - 'mobile/android/**'
      - '.github/workflows/mobile-*.yml'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate source and prepare candidate
    if: github.ref == 'refs/heads/stage'
    uses: ./.github/workflows/release-build.yml
    with:
      # Every Mac candidate of this repository is Developer ID signed, notarized and
      # stapled; there is no switch to turn that off. A fork has no Apple secrets, so it
      # builds an explicitly unsigned candidate, which publication refuses.
      macos_signing: ${{ github.repository == 'zacharyivie/Raticode' }}
      windows_signing: ${{ vars.WINDOWS_RELEASE_SIGNING == 'true' }}
    secrets: inherit

  stage:
    name: Stage exact files
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Download this run's packages and evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: raticode-*
          path: candidate-input
      - name: Create candidate manifest and verify completeness
        env:
          MACOS_SIGNED: ${{ needs.prepare.outputs.macos_signed }}
          WINDOWS_SIGNED: ${{ needs.prepare.outputs.windows_signed }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-candidate.py manifest
      - name: Attest all desktop, CLI, checksum and audit artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*
      - name: Upload draft and verify every remote asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-candidate.py stage
