[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
core = "1.19.1"
activity = "1.13.0"
lifecycle = "2.10.0"
junit = "4.13.2"
# Keep current with Firefox releases: GeckoView carries the browser engine, so its security fixes arrive through this version.
geckoview = "160.0.20261104181552"
webkit = "1.18.0"
testRunner = "1.7.0"
testJunit = "1.3.0"

[libraries]
# Not used directly: GeckoView brings in an older copy through Media3 (see the constraint in app/build.gradle.kts).
guava = { group = "com.google.guava", name = "guava", version = "33.8.0-android" }
geckoview = { group = "org.mozilla.geckoview", name = "geckoview", version.ref = "geckoview" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
commonmark = { module = "org.commonmark:commonmark", version = "0.32.0" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version = "0.32.0" }
commonmark-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version = "0.32.0" }
commonmark-tasklist = { module = "org.commonmark:commonmark-ext-task-list-items", version = "0.32.0" }
tink-android = { module = "com.google.crypto.tink:tink-android", version = "1.24.0" }
gson = { module = "com.google.code.gson:gson", version = "2.15.0" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version = "4.3.0" }
json = { module = "org.json:json", version = "20260814" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-icons = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material = { module = "androidx.compose.material3:material3" }
androidx-compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "testJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
